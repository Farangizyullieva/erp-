packages:
  - backend
  - frontend
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@nestjs/core': false
  '@swc/core': false
  esbuild: true
  sharp: false
  unrs-resolver: false
# Tranzitiv bog'liqliklardagi ma'lum zaifliklar uchun majburiy versiyalar (pnpm audit)
overrides:
  postcss: '>=8.5.23 <9'
